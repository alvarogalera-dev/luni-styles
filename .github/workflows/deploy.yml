name: Deploy to Contabo VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Execute Deployment on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /home/lunistyles/htdocs/lunistyles.com
            
            # Remove any existing .git if it's the first time
            if [ ! -d ".git" ]; then
              git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/alvarogalera-dev/luni-styles.git temp_dir
              mv temp_dir/.git .
              rm -rf temp_dir
              git reset --hard HEAD
            fi
            
            # Configure git
            git config pull.rebase false
            
            # Backup DB safely
            cp database/database.sqlite database/database.sqlite.bak || true
            
            git stash
            
            # Pull latest changes using token
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/alvarogalera-dev/luni-styles.git
            git pull origin main
            
            # Restore DB
            mv database/database.sqlite.bak database/database.sqlite || true
            
            # Install PHP dependencies
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev
            
            # Install Node dependencies and build
            npm ci
            npm run build
            
            # Optimize Laravel
            php artisan optimize:clear
            php artisan storage:link
